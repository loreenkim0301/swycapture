<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>SwyCapture</title>
<link rel="stylesheet" href="annotator.css" />
</head>
<body>
  <header class="swyshot-header">
    <div class="swyshot-brand">
      <span class="swyshot-dot"></span>
      <span class="swyshot-title"><span data-i18n="brandName"></span> <span id="swyshot-version" class="swyshot-badge"></span></span>
    </div>
    <div class="swyshot-hint" data-i18n="headerHint"></div>
    <div class="swyshot-actions">
      <span id="swyshot-count" class="swyshot-count"></span>
      <button id="swyshot-save-html" class="swyshot-btn-secondary" data-i18n="saveHtmlBtn"></button>
      <button id="swyshot-save-pdf" class="swyshot-btn-secondary" data-i18n="savePdfBtn"></button>
      <button id="swyshot-save-png" class="swyshot-btn-primary" data-i18n="savePngBtn"></button>
    </div>
  </header>

  <main class="swyshot-main" id="swyshot-main">
    <div id="swyshot-canvas" class="swyshot-canvas">
      <img id="swyshot-image" data-i18n-alt="imageAlt" />
      <!-- 핀들이 여기에 동적으로 삽입됩니다 -->
    </div>

    <aside id="swyshot-sidebar" class="swyshot-sidebar">
      <div class="swyshot-sidebar-title" data-i18n="sidebarTitle"></div>
      <ol id="swyshot-comment-list" class="swyshot-comment-list"></ol>
      <div id="swyshot-empty" class="swyshot-empty"></div>
    </aside>

    <svg id="swyshot-connector" class="swyshot-connector"></svg>
  </main>

  <script src="annotator.js"></script>
</body>
</html>
